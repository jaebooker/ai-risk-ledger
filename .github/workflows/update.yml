name: Update data

# Fetches new readings and commits them. Vercel redeploys the site on every push to main.

on:
  schedule:
    - cron: "17 */6 * * *"   # every six hours, off the top of the hour
  workflow_dispatch:
    inputs:
      force:
        description: "Accept moves above the sanity threshold (after a real jump)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ledger-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest forecasts
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
        run: python -m ledger update ${{ inputs.force && '--force' || '' }}
      - name: Commit new readings
        run: |
          git config user.name "ledger-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history site/data.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: readings $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash
            git push
          fi
