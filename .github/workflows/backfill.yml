name: Backfill history

# Run by hand after adding a question, to pull its full price history.
on:
  workflow_dispatch:
    inputs:
      id:
        description: "Question id to backfill (blank = all questions)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ledger-update
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backfill
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
        run: |
          if [ -n "${{ inputs.id }}" ]; then
            python -m ledger backfill --id "${{ inputs.id }}"
          else
            python -m ledger backfill
          fi
      - name: Commit
        run: |
          git config user.name "ledger-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history
          git diff --cached --quiet || (git commit -m "data: backfill ${{ inputs.id || 'all' }}" && git push)
